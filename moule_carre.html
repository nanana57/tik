<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 16 Carrés</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: linear-gradient(to bottom, #2c3e50, #000000); height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: white; }

        .app-container { width: 100%; max-width: 900px; height: 100vh; display: flex; flex-direction: column; align-items: center; position: relative; padding: 20px; }

        .header { width: 100%; text-align: center; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .title { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .current-points-box { background: rgba(0, 255, 127, 0.1); padding: 10px 25px; border-radius: 12px; border: 2px solid #00ff7f; text-align: center; min-width: 140px; }
        .points-label { font-size: 11px; color: #cfcfcf; text-transform: uppercase; }
        .points-value { font-size: 36px; font-weight: 900; color: #00ff7f; transition: color 0.3s; }

        .image-area { position: relative; width: 100%; max-width: 800px; height: 500px; background: #000; border-radius: 15px; border: 4px solid #333; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        #charImage { width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        .grid-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); z-index: 10; width: 100%; height: 100%; }
        .grid-cell { background-color: #111; border: 1px solid rgba(255,255,255,0.05); transition: opacity 0.3s ease; opacity: 1; }
        .grid-cell.revealed { opacity: 0; }

        .timer-wrapper { width: 100%; max-width: 800px; margin-bottom: 20px; }
        .timer-container { width: 100%; height: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #00ff7f, #ffff00, #ff4500); transform-origin: left; }

        .answer-zone { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; width: 100%; text-align: center; }
        .char-name { font-size: 42px; font-weight: 900; text-transform: uppercase; opacity: 0; transform: translateY(20px); transition: all 0.5s; text-shadow: 0 5px 20px rgba(0,0,0,1); }
        .char-name.visible { opacity: 1; transform: translateY(0); }
        .counter { font-size: 14px; color: #666; margin-top: auto; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="title" id="mainPrompt">QUIZ 16 CARRÉS</div>
            <div class="current-points-box" id="pointsBox">
                <div class="points-label">Score Possible</div>
                <div class="points-value" id="scoreValue">5 PTS</div>
            </div>
        </div>

        <div class="image-area" id="imageContainer">
            <div class="grid-overlay" id="gridContainer"></div>
            <img src="" id="charImage"> 
        </div>

        <div class="timer-wrapper">
            <div class="timer-container">
                <div class="timer-bar" id="timerBar"></div>
            </div>
        </div>

        <div class="answer-zone">
            <div class="char-name" id="charName">???</div>
            <div class="counter" id="counter">Chargement...</div>
        </div>
    </div>

    <script>
        window.quizData = [];
        window.startQuiz = function() {
            if (window.quizData && window.quizData.length > 0) {
                playRound();
            }
        };

        const STEP_TIME = 2000;     
        const TOTAL_DURATION = 14000; 
        let currentRound = 0;
        let gridInterval = null;

        const img = document.getElementById('charImage');
        const gridContainer = document.getElementById('gridContainer');
        const timerBar = document.getElementById('timerBar');
        const scoreValue = document.getElementById('scoreValue');
        const pointsBox = document.getElementById('pointsBox');
        const charName = document.getElementById('charName');
        const counter = document.getElementById('counter');
        const mainPrompt = document.getElementById('mainPrompt');

        function playRound() {
            if (currentRound >= window.quizData.length) return;
            const data = window.quizData[currentRound];
            
            clearInterval(gridInterval);
            charName.classList.remove('visible');
            charName.innerText = "???";
            mainPrompt.innerText = data.promptText || "DEVINE CE PERSONNAGE";
            counter.innerText = `${currentRound + 1} / 8`;
            
            updateScoreDisplay(5);
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            gridContainer.style.opacity = '1';

            img.src = data.imgUrl;
            img.onload = () => {
                resetGrid();
                setTimeout(() => { startGridSequence(data); }, 500);
            };
        }

        function resetGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                let cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.id = `cell-${i}`;
                gridContainer.appendChild(cell);
            }
        }

        function startGridSequence(data) {
            let availableIndices = Array.from({length: 16}, (_, i) => i);
            availableIndices.sort(() => Math.random() - 0.5);
            let stepCount = 0;

            timerBar.style.transition = `width ${TOTAL_DURATION}ms linear`;
            timerBar.style.width = '0%';

            removeSquares(2, availableIndices);

            gridInterval = setInterval(() => {
                stepCount++; 
                if (availableIndices.length === 0) {
                    revealAnswer(data);
                    return;
                }

                let nextScore = 5 - stepCount;
                if (nextScore < 1) nextScore = 1;
                updateScoreDisplay(nextScore);

                let amountToRemove = (stepCount >= 5) ? 3 : 2;
                removeSquares(amountToRemove, availableIndices);
            }, STEP_TIME);
        }

        function removeSquares(amount, indicesArray) {
            for(let k=0; k < amount; k++) {
                if (indicesArray.length > 0) {
                    let indexToRemove = indicesArray.pop();
                    let cell = document.getElementById(`cell-${indexToRemove}`);
                    if(cell) cell.classList.add('revealed');
                }
            }
        }

        function updateScoreDisplay(points) {
            scoreValue.innerText = points + (points > 1 ? " PTS" : " PT");
            const colors = { 5: "#00ff7f", 4: "#ccff00", 3: "#ffff00", 2: "#ffcc00", 1: "#ff0000" };
            const color = colors[points] || "#ff0000";
            
            scoreValue.style.color = color;
            pointsBox.style.borderColor = color;
            pointsBox.style.background = `rgba(${hexToRgb(color)}, 0.1)`;
        }

        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        function revealAnswer(data) {
            clearInterval(gridInterval);
            document.querySelectorAll('.grid-cell').forEach(cell => cell.classList.add('revealed'));

            scoreValue.innerText = "Fini !";
            scoreValue.style.color = "#fff";
            pointsBox.style.borderColor = "#fff";

            charName.innerText = data.name;
            charName.classList.add('visible');

            setTimeout(() => {
                currentRound++;
                playRound();
            }, 3000);
        }
    </script>
</body>
</html>
