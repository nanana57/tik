<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manga Quiz 4-3-2-1</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --manga-yellow: #ffde00; --manga-red: #eb2f06; --dark: #000000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--dark);
            color: white;
            font-family: 'Montserrat', sans-serif;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tiktok-container {
            width: 1080px;
            height: 1920px;
            background-color: #1a1a1a;
            background-image: radial-gradient(circle, transparent 20%, #000 85%), repeating-conic-gradient(from 0deg, #242424 0deg 2deg, transparent 2deg 15deg);
            position: relative;
            border: 12px solid #000;
            display: flex;
            flex-direction: column;
            padding: 50px 45px;
        }
        .header {
            text-align: center;
            font-family: 'Bangers', cursive;
            font-size: 86px;
            color: var(--manga-yellow);
            -webkit-text-stroke: 3px #000;
            text-shadow: 8px 8px 0 var(--manga-red);
            z-index: 10;
            margin-bottom: 30px;
        }
        .logo-top {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 6px solid #fff;
            object-fit: cover;
            display: block;
            margin: 0 auto 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 28px;
            position: relative;
            z-index: 5;
            padding-bottom: 40px;
        }
        .quiz-row {
            display: flex;
            align-items: center;
            gap: 32px;
            flex: 1;
            background: rgba(0, 0, 0, 0.45);
            border: 4px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 24px 30px;
        }
        .point-box {
            width: 135px;
            height: 135px;
            flex-shrink: 0;
            background: #fff;
            border: 7px solid #000;
            transform: rotate(-3deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .point-box.active {
            background: var(--manga-yellow);
            transform: rotate(2deg) scale(1.08);
            box-shadow: 10px 10px 0 #000;
        }
        .point-box .val {
            font-size: 68px;
            font-weight: 900;
            color: #000;
            line-height: 1;
        }
        .point-box .label {
            font-size: 20px;
            font-weight: 900;
            color: #000;
            margin-top: 4px;
        }
        .text-box {
            flex: 1;
            font-size: 36px;
            line-height: 1.35;
            font-weight: 800;
            text-shadow: 3px 3px 0 #000;
        }
        .cursor {
            display: inline-block;
            width: 14px;
            height: 36px;
            background: var(--manga-yellow);
            margin-left: 8px;
            vertical-align: middle;
        }

        .reveal-overlay {
            position: absolute;
            inset: 0;
            background: #111;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 50px;
        }
        .final-img-box {
            position: relative;
            width: 880px;
            height: 980px;
            border: 12px solid #fff;
            box-shadow: 18px 18px 0 #000;
            overflow: hidden;
            background: #000;
            border-radius: 20px;
        }
        .img-bg-blur {
            position: absolute;
            inset: -10%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.45);
        }
        .final-img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .final-title {
            font-family: 'Bangers', cursive;
            font-size: 96px;
            color: var(--manga-yellow);
            margin-top: 45px;
            text-align: center;
            -webkit-text-stroke: 4px #000;
            text-shadow: 10px 10px 0 var(--manga-red);
            line-height: 1.1;
        }

        /* INTRO 1s & FIN */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #eb2f06 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        #flyingIconsContainer {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }
        .flying-particle {
            position: absolute;
            top: 50%;
            left: 50%;
            object-fit: contain;
            opacity: 0;
        }
        @keyframes explodeOut {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.4); opacity: 0; }
        }
        .intro-logo-heartbeat {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            object-fit: cover;
            border: 12px solid #000;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            z-index: 10;
            animation: heartbeat 0.85s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(0.85); }
            30% { transform: scale(1.15); }
            60% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }
        .intro-fade-out {
            opacity: 0;
            transition: opacity 0.15s ease-out;
            pointer-events: none;
        }
        .end-box {
            background: #ffde00;
            color: #000;
            border: 10px solid #000;
            box-shadow: 16px 16px 0 var(--manga-red);
            padding: 50px;
            border-radius: 30px;
            transform: rotate(-2deg);
            margin-top: 50px;
            width: 90%;
            font-family: 'Bangers', cursive;
            font-size: 72px;
        }
    </style>
</head>
<body>
    <div class="tiktok-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <span id="header-text">QUESTION 1/8</span>
        </div>

        <div class="game-content">
            <div class="quiz-row"><div class="point-box" id="p4"><span class="val">4</span><span class="label">PTS</span></div><div class="text-box" id="t4"></div></div>
            <div class="quiz-row"><div class="point-box" id="p3"><span class="val">3</span><span class="label">PTS</span></div><div class="text-box" id="t3"></div></div>
            <div class="quiz-row"><div class="point-box" id="p2"><span class="val">2</span><span class="label">PTS</span></div><div class="text-box" id="t2"></div></div>
            <div class="quiz-row"><div class="point-box" id="p1"><span class="val">1</span><span class="label">PT</span></div><div class="text-box" id="t1"></div></div>

            <div class="reveal-overlay" id="reveal-zone">
                <div class="final-img-box" id="final-img-box"></div>
                <div id="final-title" class="final-title"></div>
            </div>
        </div>

        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <div class="overlay" id="endScreen" style="display:none; background: rgba(0,0,0,0.95);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:300px;height:300px;" alt="Logo">
            <div class="end-box">DONNE TON SCORE EN COMMENTAIRE ! 👇</div>
        </div>
    </div>

    <script>
        const database = __DONNEES_IA__;
        const typingSpeed = 22;
        const revealTime = 1800;
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];
        let currentIdx = 0;

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 1400 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1800 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '110px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; loadQuiz(); }, 150);
            }, 850);
        };

        async function loadQuiz() {
            if (!database || currentIdx >= database.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            document.getElementById('reveal-zone').style.display = 'none';
            document.getElementById('header-text').innerText = `QUESTION ${currentIdx + 1}/${database.length}`;
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`t${i}`).innerHTML = "";
                document.getElementById(`p${i}`).classList.remove('active');
            }

            const data = database[currentIdx];
            const clues = data.clues && data.clues.length >= 4 ? data.clues : [
                "Indice 4 pts : Issu de l'univers " + (data.anime || "Anime"),
                "Indice 3 pts : Très populaire auprès des fans",
                "Indice 2 pts : A marqué l'histoire de son œuvre",
                "Indice 1 pt : Son nom commence par " + (data.name ? data.name[0] : "?")
            ];

            const ids = [4, 3, 2, 1];
            for (let s = 0; s < 4; s++) {
                document.querySelectorAll('.point-box').forEach(b => b.classList.remove('active'));
                document.getElementById(`p${ids[s]}`).classList.add('active');
                await typeWriter(document.getElementById(`t${ids[s]}`), clues[s]);
            }

            const imgBox = document.getElementById('final-img-box');
            const titleEl = document.getElementById('final-title');
            if (data.isBait) {
                imgBox.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-family:'Bangers';font-size:84px;padding:40px;text-align:center;">TU L'AS TROUVÉ ?</div>`;
                titleEl.innerText = "ÉCRIS LA RÉPONSE EN COMMENTAIRE ! 👇";
            } else {
                imgBox.innerHTML = `<div class="img-bg-blur" style="background-image:url('${data.imgUrl}')"></div><img src="${data.imgUrl}" class="final-img">`;
                titleEl.innerText = data.name;
            }
            document.getElementById('reveal-zone').style.display = 'flex';

            setTimeout(() => { currentIdx++; loadQuiz(); }, revealTime);
        }

        function typeWriter(element, text) {
            return new Promise(resolve => {
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                        i++; setTimeout(type, typingSpeed);
                    } else { element.innerHTML = text; setTimeout(resolve, 250); }
                }
                type();
            });
        }
    </script>
</body>
</html>
