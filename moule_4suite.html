<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Quiz 4-3-2-1</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --manga-yellow: #ffde00; --manga-red: #eb2f06; --dark: #000000; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--dark); color: white; font-family: 'Montserrat', sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .tiktok-container { width: 100%; max-width: 520px; height: 100%; background-color: #1a1a1a; background-image: radial-gradient(circle, transparent 20%, #000 80%), repeating-conic-gradient(from 0deg, #222 0deg 1deg, transparent 1deg 15deg); position: relative; border: 6px solid #000; display: flex; flex-direction: column; }
        .header { padding: 15px 10px 5px; text-align: center; font-family: 'Bangers', cursive; font-size: 38px; color: var(--manga-yellow); -webkit-text-stroke: 1.5px #000; text-shadow: 4px 4px 0 var(--manga-red); z-index: 10; }
        .logo-top { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; display: block; margin: 0 auto 5px; }
        .game-content { flex: 1; display: flex; flex-direction: column; padding: 10px 20px; gap: 12px; position: relative; z-index: 5; }
        .quiz-row { display: flex; align-items: center; gap: 15px; flex: 1; }
        .point-box { width: 65px; height: 65px; flex-shrink: 0; background: #fff; border: 4px solid #000; transform: rotate(-3deg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; }
        .point-box.active { background: var(--manga-yellow); transform: rotate(2deg) scale(1.1); box-shadow: 5px 5px 0 #000; }
        .point-box .val { font-size: 32px; font-weight: 900; color: #000; line-height: 1; }
        .point-box .label { font-size: 9px; font-weight: bold; color: #000; }
        .text-box { flex: 1; font-size: 16px; line-height: 1.3; font-weight: 700; text-shadow: 2px 2px 0 #000; }
        .cursor { display: inline-block; width: 8px; height: 16px; background: var(--manga-yellow); margin-left: 4px; }

        .reveal-overlay { position: absolute; inset: 0; background: #111; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
        .final-img-box { position: relative; width: 85%; height: 55%; border: 6px solid #fff; box-shadow: 10px 10px 0 #000; overflow: hidden; background: #000; }
        .img-bg-blur { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(15px) brightness(0.5); }
        .final-img { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; }
        .final-title { font-family: 'Bangers', cursive; font-size: 46px; color: var(--manga-yellow); margin-top: 20px; text-align: center; -webkit-text-stroke: 2px #000; text-shadow: 5px 5px 0 var(--manga-red); }

        /* INTRO 1s & FIN */
        .overlay { position: absolute; inset: 0; background: linear-gradient(135deg, #1a1a1a 0%, #eb2f06 100%); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #flyingIconsContainer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .flying-particle { position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0; }
        @keyframes explodeOut { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.3); opacity: 0; } }
        .intro-logo-heartbeat { width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid #000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10; animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(0.85); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        .end-box { background: #ffde00; color: #000; border: 5px solid #000; box-shadow: 8px 8px 0 var(--manga-red); padding: 25px; border-radius: 15px; transform: rotate(-2deg); margin-top: 25px; width: 90%; font-family: 'Bangers', cursive; font-size: 34px; }
    </style>
</head>
<body>
    <div class="tiktok-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <span id="header-text">QUESTION 1/5</span>
        </div>

        <div class="game-content">
            <div class="quiz-row"><div class="point-box" id="p4"><span class="val">4</span><span class="label">PTS</span></div><div class="text-box" id="t4"></div></div>
            <div class="quiz-row"><div class="point-box" id="p3"><span class="val">3</span><span class="label">PTS</span></div><div class="text-box" id="t3"></div></div>
            <div class="quiz-row"><div class="point-box" id="p2"><span class="val">2</span><span class="label">PTS</span></div><div class="text-box" id="t2"></div></div>
            <div class="quiz-row"><div class="point-box" id="p1"><span class="val">1</span><span class="label">PT</span></div><div class="text-box" id="t1"></div></div>

            <div class="reveal-overlay" id="reveal-zone">
                <div class="final-img-box" id="final-img-box"></div>
                <div id="final-title" class="final-title"></div>
            </div>
        </div>

        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <div class="overlay" id="endScreen" style="display:none; background: rgba(0,0,0,0.95);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:160px;height:160px;" alt="Logo">
            <div class="end-box">DONNE TON SCORE EN COMMENTAIRE ! 👇</div>
        </div>
    </div>

    <script>
        const database = __DONNEES_IA__;
        const typingSpeed = 22;
        const revealTime = 1800;
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];
        let currentIdx = 0;

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1000 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '50px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; loadQuiz(); }, 150);
            }, 850);
        };

        async function loadQuiz() {
            if (currentIdx >= database.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            document.getElementById('reveal-zone').style.display = 'none';
            document.getElementById('header-text').innerText = `QUESTION ${currentIdx + 1}/${database.length}`;
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`t${i}`).innerHTML = "";
                document.getElementById(`p${i}`).classList.remove('active');
            }

            const data = database[currentIdx];
            const clues = data.clues && data.clues.length >= 4 ? data.clues : [
                "Indice 4 pts : Issu de l'univers " + (data.anime || "Anime"),
                "Indice 3 pts : Très populaire auprès des fans",
                "Indice 2 pts : A marqué l'histoire de son œuvre",
                "Indice 1 pt : Son nom commence par " + (data.name ? data.name[0] : "?")
            ];

            const ids = [4, 3, 2, 1];
            for (let s = 0; s < 4; s++) {
                document.querySelectorAll('.point-box').forEach(b => b.classList.remove('active'));
                document.getElementById(`p${ids[s]}`).classList.add('active');
                await typeWriter(document.getElementById(`t${ids[s]}`), clues[s]);
            }

            const imgBox = document.getElementById('final-img-box');
            const titleEl = document.getElementById('final-title');
            if (data.isBait) {
                imgBox.innerHTML = `<div style="color:#fff;font-family:'Bangers';font-size:38px;padding:30px;text-align:center;">TU L'AS TROUVÉ ?</div>`;
                titleEl.innerText = "ÉCRIS LA RÉPONSE EN COMMENTAIRE ! 👇";
            } else {
                imgBox.innerHTML = `<div class="img-bg-blur" style="background-image:url('${data.imgUrl}')"></div><img src="${data.imgUrl}" class="final-img">`;
                titleEl.innerText = data.name;
            }
            document.getElementById('reveal-zone').style.display = 'flex';

            setTimeout(() => { currentIdx++; loadQuiz(); }, revealTime);
        }

        function typeWriter(element, text) {
            return new Promise(resolve => {
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                        i++; setTimeout(type, typingSpeed);
                    } else { element.innerHTML = text; setTimeout(resolve, 250); }
                }
                type();
            });
        }
    </script>
</body>
</html>
