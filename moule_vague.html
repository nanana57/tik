<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Vague Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #6441a5; font-family: 'Montserrat', sans-serif; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; color: white; position: relative; }
        body::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; z-index: -2; background: repeating-conic-gradient(from 0deg at 50% 50%, #ffffff 0deg, #ffffff 15deg, #9b59b6 30deg, #8e44ad 45deg, #9b59b6 60deg, #ffffff 75deg, #ffffff 90deg); animation: spinBackground 25s linear infinite; }
        body::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.35); z-index: -1; }
        @keyframes spinBackground { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .app-container { width: 100%; max-width: 500px; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; padding: 15px; justify-content: space-between; }
        .header-box { background: rgba(255,255,255,0.95); border: 4px solid #8e44ad; border-radius: 20px; box-shadow: 0 8px 0 rgba(0,0,0,0.3); padding: 10px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .logo-top { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #8e44ad; object-fit: cover; margin-bottom: 5px; }
        .sub-title { font-family: 'Bangers', cursive; font-size: 34px; color: #ffcc00; -webkit-text-stroke: 1.5px black; text-shadow: 2px 2px 0 #000; margin: 0; }

        .image-frame { position: relative; width: 340px; height: 340px; background: #111; border-radius: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; overflow: hidden; border: 5px solid #fff; }
        .img-bg-blur { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(16px) brightness(0.5); z-index: 1; }
        .quiz-image { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; filter: url(#distortionFilter); transform: scale(1.08); transition: transform 0.3s ease-out; }
        .quiz-image.revealed { transform: scale(1); }

        .timer-container { width: 90%; height: 28px; border: 3px solid #fff; border-radius: 25px; padding: 3px; background: rgba(0,0,0,0.5); }
        .timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffcc00, #ff9900); border-radius: 20px; }

        .answer-box { height: 110px; opacity: 0; transition: opacity 0.3s ease-in; text-align: center; width: 100%; display: flex; align-items: center; justify-content: center; }
        .answer-text { font-family: 'Bangers', cursive; font-size: 42px; color: #fff; text-shadow: 3px 3px 0 #8e44ad, -3px -3px 0 #8e44ad; letter-spacing: 2px; line-height: 1.1; }
        .cta-text { font-size: 26px; color: #ffcc00; -webkit-text-stroke: 1px black; }
        .level-counter { position: absolute; bottom: 15px; left: 15px; font-family: 'Bangers', cursive; font-size: 26px; color: #fff; background: rgba(142, 68, 173, 0.9); padding: 4px 14px; border-radius: 10px; border: 2px solid #fff; }
        .svg-filters { position: absolute; width: 0; height: 0; pointer-events: none; }

        /* INTRO 1s & FIN */
        .overlay { position: absolute; inset: 0; background: linear-gradient(135deg, #6441a5 0%, #2a0845 100%); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #flyingIconsContainer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .flying-particle { position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0; }
        @keyframes explodeOut { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.3); opacity: 0; } }
        .intro-logo-heartbeat { width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid #000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10; animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(0.85); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        .end-box { background: #ffea00; color: #000; border: 5px solid #000; box-shadow: 8px 8px 0 #000; padding: 25px; border-radius: 15px; transform: rotate(-2deg); margin-top: 25px; width: 90%; font-family: 'Bangers', cursive; font-size: 34px; }
    </style>
</head>
<body>
    <svg class="svg-filters">
        <defs>
            <filter id="distortionFilter">
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
                <feDisplacementMap id="displacementMap" in="SourceGraphic" in2="noise" scale="300" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="app-container">
        <div class="header-box">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <h1 class="sub-title">DEVINE LE PERSONNAGE</h1>
        </div>

        <div class="image-frame">
            <div class="img-bg-blur" id="bgBlur"></div>
            <img src="" class="quiz-image" id="quizImg">
        </div>

        <div class="timer-container"><div class="timer-fill" id="timerBar"></div></div>
        <div class="answer-box" id="answerBox"><div class="answer-text" id="charName"></div></div>
        <div class="level-counter" id="levelCounter">1/8</div>

        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <div class="overlay" id="endScreen" style="display:none; background: rgba(0,0,0,0.94);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:160px;height:160px;" alt="Logo">
            <div class="end-box">
                DONNE TON SCORE EN COMMENTAIRE ! 👇<br>
                <span style="font-size:24px;color:#6441a5;">ET AS-TU TROUVÉ LE 3ÈME PERSONNAGE ?</span>
            </div>
        </div>
    </div>

    <script>
        const database = __DONNEES_IA__;
        const DURATION_MS = 3500;
        const MAX_DISTORTION = 320;
        const END_DISTORTION = MAX_DISTORTION * 0.30;
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];

        let currentIdx = 0, startTime = null, isPlaying = false;
        const displacementMap = document.getElementById('displacementMap');
        const timerBar = document.getElementById('timerBar');
        const quizImg = document.getElementById('quizImg');
        const answerBox = document.getElementById('answerBox');
        const charName = document.getElementById('charName');

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1000 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '50px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; playLevel(); }, 150);
            }, 850);
        };

        function playLevel() {
            if (currentIdx >= database.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            const data = database[currentIdx];
            document.getElementById('levelCounter').innerText = `${currentIdx + 1}/${database.length}`;
            isPlaying = true;
            answerBox.style.transition = 'none'; answerBox.style.opacity = '0';
            charName.innerText = data.name;
            void answerBox.offsetWidth;
            answerBox.style.transition = 'opacity 0.3s ease-in';

            quizImg.classList.remove('revealed');
            quizImg.src = data.imgUrl;
            document.getElementById('bgBlur').style.backgroundImage = `url('${data.imgUrl}')`;
            displacementMap.setAttribute('scale', MAX_DISTORTION);
            timerBar.style.width = '100%';
            startTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / DURATION_MS, 1);
            const remaining = 1 - progress;
            timerBar.style.width = (remaining * 100) + '%';
            displacementMap.setAttribute('scale', END_DISTORTION + (remaining * (MAX_DISTORTION - END_DISTORTION)));

            if (progress < 1) requestAnimationFrame(gameLoop);
            else endLevel();
        }

        function endLevel() {
            isPlaying = false;
            const data = database[currentIdx];
            if (data.isBait) {
                charName.innerHTML = "ALORS TU AS TROUVÉ ?<br><span class='cta-text'>DONNE LA RÉPONSE EN COMMENTAIRE 👇</span>";
                answerBox.style.opacity = 1;
            } else {
                displacementMap.setAttribute('scale', 0);
                quizImg.classList.add('revealed');
                answerBox.style.opacity = 1;
            }
            setTimeout(() => { currentIdx++; playLevel(); }, 1800);
        }
    </script>
</body>
</html>
