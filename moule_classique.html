<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Anime Classique</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Komika+Axis&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; font-family: 'Komika Axis', sans-serif; overflow: hidden; color: #000; position: relative; }
        body::before { content: ""; position: absolute; top: 50%; left: 50%; width: 200vmax; height: 200vmax; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.06) 0deg 5deg, transparent 5deg 10deg); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; animation: spinAction 40s linear infinite; }
        @keyframes spinAction { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .app-container { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; z-index: 1; padding: 15px; }
        .header { width: 100%; text-align: center; margin-top: 5px; flex-shrink: 0; }
        .logo-da { height: 80px; width: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; filter: drop-shadow(4px 4px 0px #000); border: 4px solid #000; }
        .subtitle-top { color: #ffcc00; font-size: 20px; text-shadow: 2px 2px 0 #000; font-weight: 700; background: rgba(0,0,0,0.6); padding: 6px 20px; border-radius: 12px; display: inline-block; border: 3px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,0.6); text-transform: uppercase; }
        .level-box { display: inline-block; background: #fff; color: #000; font-weight: 700; font-size: 16px; padding: 5px 18px; border: 3px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,0.8); margin-top: 8px; transform: skew(-10deg); text-transform: uppercase; }

        .image-area-wrapper { width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; margin: 12px 0; }
        .image-card { position: relative; width: 92%; height: 92%; max-height: 430px; max-width: 430px; border-radius: 20px; border: 6px solid #fff; box-shadow: 0 12px 25px rgba(0,0,0,0.4), 8px 8px 0 #000; overflow: hidden; background: #111; display: flex; justify-content: center; align-items: center; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .image-card.pop { transform: scale(1.04); }
        .img-bg-blur { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(18px) brightness(0.5); z-index: 1; }
        .img-full-contain { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; }

        .timer-wrapper { width: 92%; margin-bottom: 10px; flex-shrink: 0; }
        .timer-container { width: 100%; height: 26px; background: #333; border: 4px solid #fff; box-shadow: 5px 5px 0 #000; transform: skew(-10deg); overflow: hidden; }
        .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #4eff3b, #ffee00, #ff0055); transform-origin: left; }
        .animate-timer { animation: shrink linear forwards; }
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }

        .answer-zone { height: 135px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; text-align: center; z-index: 10; flex-shrink: 0; }
        .main-answer-big { font-family: 'Bangers', cursive; font-size: 42px; color: #ffcc00; margin-bottom: 8px; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #d60000; opacity: 0; transform: scale(0.5); transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); line-height: 1; }
        .sub-info-small { font-size: 16px; font-weight: 700; color: #000; background: #fff; padding: 6px 18px; border: 3px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,0.8); opacity: 0; transform: translateY(15px); transition: all 0.35s ease 0.1s; }
        .visible { opacity: 1 !important; transform: scale(1) translateY(0) !important; }
        .counter { position: absolute; bottom: 12px; right: 18px; font-size: 24px; font-weight: 700; color: #fff; -webkit-text-stroke: 1.5px #000; font-family: 'Bangers', cursive; z-index: 20; }

        /* INTRO 1 SECONDE & FIN */
        .overlay { position: absolute; inset: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #flyingIconsContainer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .flying-particle { position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0; }
        @keyframes explodeOut { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.3); opacity: 0; } }
        .intro-logo-heartbeat { width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid #000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10; animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(0.85); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        .end-box { background: #ffea00; color: #000; border: 5px solid #000; box-shadow: 8px 8px 0 #000; padding: 25px; border-radius: 15px; transform: rotate(-2deg); margin-top: 25px; width: 90%; font-family: 'Bangers', cursive; font-size: 34px; line-height: 1.2; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-da" alt="Logo"><br>
            <div class="subtitle-top" id="promptDisplay">NOMME CE PERSONNAGE !</div><br>
            <div class="level-box" id="levelDisplay">FACILE</div>
        </div>

        <div class="image-area-wrapper">
            <div class="image-card" id="imageCard">
                <div class="img-bg-blur" id="bgBlur"></div>
                <img src="" class="img-full-contain" id="charImg">
            </div>
        </div>

        <div class="timer-wrapper"><div class="timer-container"><div class="timer-bar" id="timerBar"></div></div></div>

        <div class="answer-zone">
            <div class="main-answer-big" id="mainAnswerDisplay"></div>
            <div class="sub-info-small" id="subInfoDisplay"></div>
        </div>
        <div class="counter" id="counter">1 / 8</div>

        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <div class="overlay" id="endScreen" style="display:none; background: rgba(15,15,28,0.96);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:160px;height:160px;" alt="Logo">
            <div class="end-box">
                DONNE TON SCORE EN COMMENTAIRE ! 👇<br>
                <span style="font-size:24px; color:#d60000;">ET AS-TU TROUVÉ LE N°3 ?</span>
            </div>
        </div>
    </div>

    <script>
        const database = __DONNEES_IA__;
        const TIME_GUESS = 3200;
        const TIME_SHOW = 1800;
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];
        let index = 0;

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1000 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '50px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; startQuizRound(); }, 150);
            }, 850);
        };

        function startQuizRound() {
            if (index >= database.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            const data = database[index];
            const card = document.getElementById('imageCard');
            card.classList.remove('pop');
            card.style.borderColor = data.color || '#fff';

            document.getElementById('promptDisplay').innerText = data.promptText || 'NOMME CE PERSONNAGE !';
            const lvl = document.getElementById('levelDisplay');
            lvl.innerText = data.level || 'NORMAL';
            lvl.style.color = data.color || '#000';

            document.getElementById('mainAnswerDisplay').classList.remove('visible');
            document.getElementById('subInfoDisplay').classList.remove('visible');
            document.getElementById('counter').innerText = `${index + 1} / ${database.length}`;

            document.getElementById('bgBlur').style.backgroundImage = `url('${data.imgUrl}')`;
            document.getElementById('charImg').src = data.imgUrl;

            const timerBar = document.getElementById('timerBar');
            timerBar.classList.remove('animate-timer');
            void timerBar.offsetWidth;
            timerBar.style.animationDuration = (TIME_GUESS / 1000) + 's';
            timerBar.classList.add('animate-timer');

            setTimeout(() => revealAnswer(data), TIME_GUESS);
        }

        function revealAnswer(data) {
            const card = document.getElementById('imageCard');
            const mainAnswer = document.getElementById('mainAnswerDisplay');
            const subInfo = document.getElementById('subInfoDisplay');
            card.classList.add('pop');

            // Le 3ème personnage (index === 2 ou isBait) ne révèle jamais son nom
            if (data.isBait || index === 2) {
                mainAnswer.innerText = "TU LE CONNAIS ?";
                mainAnswer.style.color = "#ffffff";
                subInfo.innerText = "👇 DONNE LA RÉPONSE EN COMMENTAIRE ! 👇";
            } else {
                mainAnswer.innerText = data.name;
                mainAnswer.style.color = "#ffcc00";
                subInfo.innerText = "📺 " + (data.anime || "Anime");
            }

            mainAnswer.classList.add('visible');
            subInfo.classList.add('visible');
            setTimeout(() => { index++; startQuizRound(); }, TIME_SHOW);
        }
    </script>
</body>
</html>
