<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANIME PIXEL QUIZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Komika+Axis&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        /* --- 1. DESIGN GÉNÉRAL PLEIN ÉCRAN TIKTOK (1080x1920) --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
            width: 1080px; height: 1920px;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Komika Axis', 'Montserrat', sans-serif;
            overflow: hidden; color: #000; position: relative;
        }

        /* Fond animé */
        body::before {
            content: ""; position: absolute; top: 50%; left: 50%;
            width: 250vmax; height: 250vmax;
            background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.06) 0deg 2deg, transparent 2deg 4deg);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 0;
            animation: spinAction 60s linear infinite;
        }
        @keyframes spinAction { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .app-container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; 
            position: relative; z-index: 1; 
            padding: 60px 50px 70px; 
        }

        /* --- 2. HEADER --- */
        .header { width: 100%; text-align: center; flex-shrink: 0; }
        
        .logo-top {
            width: 130px; height: 130px; border-radius: 50%;
            border: 5px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            object-fit: cover; display: block; margin: 0 auto 15px;
        }

        .title {
            font-family: 'Bangers', cursive; font-size: 92px; 
            color: #fff; -webkit-text-stroke: 4px #000; text-shadow: 8px 8px 0 #6a00ff;
            letter-spacing: 3px; transform: rotate(-2deg); line-height: 1;
        }

        .level-badge {
            display: inline-block; background: #fff; color: #000; 
            font-size: 32px; padding: 10px 35px; border: 6px solid #000; 
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5); margin-top: 25px;
            transform: skew(-10deg); font-weight: 900;
            transition: background-color 0.3s ease; 
        }

        /* --- 3. ZONE CANVAS (JEU) --- */
        .image-area-wrapper {
            width: 100%; flex: 1; 
            display: flex; justify-content: center; align-items: center; 
            margin: 35px 0; position: relative;
        }
        
        .image-area {
            position: relative; 
            width: 860px; height: 860px;
            border: 10px solid #fff; border-radius: 24px;    
            box-shadow: 0 0 40px rgba(0,0,0,0.6), 16px 16px 0 #000;
            overflow: hidden; background: #000; 
            display: flex; justify-content: center; align-items: center;
        }

        canvas {
            width: 100%; height: 100%;
            object-fit: contain;
        }

        /* --- 4. TIMER --- */
        .timer-wrapper { width: 88%; margin-bottom: 25px; flex-shrink: 0; }
        .timer-container {
            width: 100%; height: 42px; background: #333;
            border: 6px solid #fff; box-shadow: 8px 8px 0 #000; transform: skew(-10deg);
        }
        .timer-bar {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, #ff00de, #00ffea);
            transform-origin: left; 
        }
        .animate-timer { animation: shrink linear forwards; }
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }

        /* --- 5. RÉPONSE --- */
        .answer-zone {
            height: 240px; width: 100%; text-align: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; z-index: 10; flex-shrink: 0;
        }
        .char-name {
            font-family: 'Bangers', cursive; font-size: 86px; color: #ffe600;
            -webkit-text-stroke: 3.5px #000; text-shadow: 7px 7px 0 #000;
            opacity: 0; transform: scale(0.5); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 15px; line-height: 1;
        }
        .anime-name {
            background: #fff; color: #000; padding: 12px 40px; border: 6px solid #000;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.8); font-size: 32px; opacity: 0; 
            transform: translateY(20px); transition: 0.4s ease 0.2s;
            font-weight: 900;
        }
        .visible { opacity: 1 !important; transform: scale(1) translateY(0) !important; }

        .counter { 
            position: absolute; bottom: 25px; right: 40px; font-size: 46px; color: #fff; 
            text-shadow: 4px 4px 0 #000; font-family: 'Bangers', cursive; z-index: 20;
        }

        /* --- 6. INTRO BATTEMENT + ICÔNES VOLANTES & FIN --- */
        .overlay {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, #2b1055 0%, #ff0055 100%);
            z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 40px;
        }
        #flyingIconsContainer {
            position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden;
        }
        .flying-particle {
            position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0;
        }
        @keyframes explodeOut {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.5); opacity: 0; }
        }
        .intro-logo-heartbeat {
            width: 380px; height: 380px; border-radius: 50%; object-fit: cover;
            border: 10px solid #000; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 10; animation: heartbeat 0.85s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(0.85); }
            30% { transform: scale(1.15); }
            60% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        
        .end-box {
            background: #ffe600; color: #000; border: 8px solid #000;
            box-shadow: 12px 12px 0 #ff00de; padding: 40px; border-radius: 20px;
            transform: rotate(-2deg); margin-top: 40px; width: 90%;
            font-family: 'Bangers', cursive; font-size: 64px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <div class="title" id="promptTitle">QUI C'EST ?!</div>
            <div class="level-badge" id="diffBadge">FACILE</div>
        </div>

        <div class="image-area-wrapper">
            <div class="image-area">
                <canvas id="gameCanvas"></canvas>
            </div>
        </div>

        <div class="timer-wrapper">
            <div class="timer-container">
                <div class="timer-bar" id="timerBar"></div>
            </div>
        </div>

        <div class="answer-zone">
            <div class="char-name" id="charName">???</div>
            <div class="anime-name" id="animeName">???</div>
        </div>

        <div class="counter" id="counter">1 / 8</div>

        <!-- ÉCRAN D'INTRO AUTOMATIQUE (BATTEMENT + ICÔNES QUI VOLENT) -->
        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <!-- ÉCRAN DE FIN -->
        <div class="overlay" id="endScreen" style="display:none; background: rgba(15, 10, 30, 0.96);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:280px;height:280px;" alt="Logo">
            <div class="end-box">DONNE TON SCORE EN COMMENTAIRE ! 👇</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION (TIMERS D'ORIGINE CONSERVÉS) ---
        const DURATION_GAME = 6500; // 6.5 secondes
        const START_PIXEL_SIZE = 60; 
        const END_PIXEL_TARGET = START_PIXEL_SIZE * 0.17;

        // --- BASE DE DONNÉES INJECTÉE PAR N8N ---
        const database = __DONNEES_IA__;

        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];

        // --- VARIABLES GLOBALES ---
        let currentIdx = 0;
        let gameCanvas = document.getElementById('gameCanvas');
        let ctx = gameCanvas.getContext('2d');
        let animationId;
        let startTime;
        let currentImgObj = null;

        // --- FONCTION DE PIXELISATION ---
        function drawPixelated(context, img, pixelSize, width, height) {
            context.imageSmoothingEnabled = false;
            let w = Math.max(1, Math.ceil(width / pixelSize));
            let h = Math.max(1, Math.ceil(height / pixelSize));

            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            let tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0, w, h);

            context.clearRect(0, 0, width, height);
            context.drawImage(tempCanvas, 0, 0, w, h, 0, 0, width, height);
        }

        // --- LANCEMENT AUTOMATIQUE : INTRO BATTEMENT + ICÔNES QUI VOLENT ---
        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 18; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 1400 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1800 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '95px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }

            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => {
                    intro.style.display = 'none';
                    loadLevel(0);
                }, 150);
            }, 850);
        };

        // --- LOGIQUE JEU ---
        function loadLevel(index) {
            if (index >= database.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            currentIdx = index;
            let data = database[index];

            // Titre dynamique ou par défaut
            if (data.promptText) {
                document.getElementById('promptTitle').innerText = data.promptText;
            }

            // Badge Couleur (compatible avec data.level de n8n ou data.diff d'origine)
            const badge = document.getElementById('diffBadge');
            const diffText = (data.level || data.diff || 'FACILE').toUpperCase();
            badge.innerText = diffText;
            badge.style.color = '#000';
            
            if (diffText.includes('FACILE')) badge.style.backgroundColor = '#00ff9d';
            else if (diffText.includes('MOYEN') || diffText.includes('NORMAL')) badge.style.backgroundColor = '#ffe600';
            else if (diffText.includes('DIFFICILE')) badge.style.backgroundColor = '#ff9100';
            else if (diffText.includes('EXPERT')) { badge.style.backgroundColor = '#ff0055'; badge.style.color = '#fff'; }
            else if (diffText.includes('DÉMON') || diffText.includes('IMPOSSIBLE')) { badge.style.backgroundColor = '#7a00cc'; badge.style.color = '#fff'; }
            else badge.style.backgroundColor = '#fff';

            const nameBox = document.getElementById('charName');
            const animeBox = document.getElementById('animeName');
            nameBox.classList.remove('visible');
            animeBox.classList.remove('visible');
            nameBox.innerText = "???";
            animeBox.innerText = "???";
            animeBox.style.fontSize = "32px";

            document.getElementById('counter').innerText = (index + 1) + " / " + database.length;
            
            let bar = document.getElementById('timerBar');
            bar.classList.remove('animate-timer');
            void bar.offsetWidth; 
            bar.style.animationDuration = (DURATION_GAME / 1000) + "s";
            
            currentImgObj = new Image();
            // INDISPENSABLE pour que le Canvas accepte de pixeliser les images d'AniList/Kitsu/PokeAPI
            currentImgObj.crossOrigin = "anonymous";
            // Utilise un proxy CORS gratuit en secours si le serveur d'image bloque le Canvas
            const rawUrl = data.imgUrl || (data.id ? data.id + '.jpg' : '');
            currentImgObj.src = rawUrl.startsWith('http')
                ? `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}&output=jpg`
                : rawUrl;
            
            currentImgObj.onload = () => {
                gameCanvas.width = 800; 
                gameCanvas.height = 800 * (currentImgObj.height / currentImgObj.width);
                
                bar.classList.add('animate-timer');
                startTime = null;
                animationId = requestAnimationFrame(gameLoop);
            };
            
            currentImgObj.onerror = () => {
                // Si une image échoue, on passe directement à la question suivante sans bloquer la vidéo
                setTimeout(() => loadLevel(currentIdx + 1), 500);
            };
        }

        function gameLoop(timestamp) {
            if (!startTime) startTime = timestamp;
            let progress = timestamp - startTime;
            let pct = progress / DURATION_GAME;
            let data = database[currentIdx];
            let isTrap = Boolean(data.isBait) || currentIdx === 3;

            if (progress < DURATION_GAME) {
                let currentPixelSize = START_PIXEL_SIZE - (pct * (START_PIXEL_SIZE - END_PIXEL_TARGET));
                
                if (isTrap) {
                    currentPixelSize = Math.max(currentPixelSize, START_PIXEL_SIZE * 0.25);
                }

                drawPixelated(ctx, currentImgObj, currentPixelSize, gameCanvas.width, gameCanvas.height);
                animationId = requestAnimationFrame(gameLoop);
            } else {
                // TEMPS ÉCOULÉ !
                let finalBlur = isTrap ? (START_PIXEL_SIZE * 0.25) : END_PIXEL_TARGET;
                drawPixelated(ctx, currentImgObj, finalBlur, gameCanvas.width, gameCanvas.height);
                timeOutSequence();
            }
        }

        function timeOutSequence() {
            let nameBox = document.getElementById('charName');
            let animeBox = document.getElementById('animeName');
            let data = database[currentIdx];
            let isTrap = Boolean(data.isBait) || currentIdx === 3;

            // SI C'EST LE PIÈGE (isBait ou Question 4 / Index 3)
            if (isTrap) {
                nameBox.style.color = "#ffe600";
                nameBox.innerText = "ALORS ?";
                animeBox.innerText = "COMMENTE LA RÉPONSE 👇";
                
                nameBox.classList.add('visible');
                animeBox.classList.add('visible');
                
                setTimeout(() => {
                    loadLevel(currentIdx + 1);
                }, 2500);

            } else {
                // POUR LES AUTRES QUESTIONS : SÉQUENCE 0 PTS
                nameBox.innerText = "0 PTS";
                nameBox.style.color = "#ff3300"; // Rouge
                nameBox.classList.add('visible');

                // On attend 1 seconde avec l'image floue et "0 PTS"
                setTimeout(() => {
                    // MAINTENANT on dévoile l'image nette
                    drawPixelated(ctx, currentImgObj, 1, gameCanvas.width, gameCanvas.height);

                    // On affiche la vraie réponse
                    nameBox.style.color = "#ffe600"; // Jaune normal
                    nameBox.innerText = data.name || "MYSTÈRE";
                    animeBox.innerText = data.anime || "Anime";
                    animeBox.classList.add('visible');

                    // On attend 2.5s pour passer au niveau suivant
                    setTimeout(() => {
                        loadLevel(currentIdx + 1);
                    }, 2500);

                }, 1000); // 1 seconde de délai
            }
        }
    </script>
</body>
</html>
