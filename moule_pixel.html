<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- 1. CORRECTION FORMAT : On force la taille de l'écran TikTok -->
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Pixel Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Komika+Axis&display=swap" rel="stylesheet">
    
    <style>
        * { 
            box-sizing: border-box; 
        }
        
        /* 2. CORRECTION FORMAT : Le body doit faire 1080x1920 exact pour éviter les bandes */
        body { 
            margin: 0; 
            padding: 0; 
            width: 1080px; 
            height: 1920px; 
            /* Ton fond bleu dégradé/strié */
            background: linear-gradient(135deg, #2b1055 0%, #7597de 100%); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-family: 'Komika Axis', sans-serif;
            position: relative;
        }

        /* Le conteneur du carré central de ta capture d'écran */
        .image-container {
            width: 600px;
            height: 600px;
            background-color: #000;
            border: 8px solid #fff;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* On s'assure que l'image remplit bien le carré */
        img, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ----- Ajoute ici le CSS de ton logo, tes textes et ta barre ----- */
        
    </style>
</head>
<body>

    <!-- ----- Ajoute ici ton logo et titre "QUI C'EST ?!" ----- -->

    <div class="image-container">
        <!-- 3. CORRECTION IMAGE NOIRE : L'attribut crossorigin est OBLIGATOIRE -->
        <img id="personnage" src="URL_INJECTEE_PAR_N8N" crossorigin="anonymous" alt="Personnage">
        
        <!-- (Si ton code utilise un Canvas pour l'effet Pixel, mets le <canvas> ici) -->
    </div>

    <!-- ----- Ajoute ici ta barre de progression "1/8" ----- -->

    <script>
        // 4. CORRECTION JAVASCRIPT (Très important si tu utilises un script pour l'effet Pixel)
        // Si c'est du JavaScript qui gère l'apparition de ton image ou le canvas, 
        // tu dois absolument lui donner l'autorisation de lire l'image avec cette ligne :
        
        /* Exemple de ton code d'animation :
        const img = new Image();
        img.crossOrigin = "anonymous"; // <-- LA LIGNE MAGIQUE QUI DÉBLOQUE L'ANIMATION
        img.src = 'L_URL_DE_TON_IMAGE';
        
        img.onload = function() {
            // Lancer l'animation de dé-pixelisation ici
        };
        */
    </script>
</body>
</html>
