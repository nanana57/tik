<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Anime - Couleurs</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Komika+Axis&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #1a1a1a 0%, #000 100%); height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; font-family: 'Komika Axis', sans-serif; overflow: hidden; color: white; }
        .app-container { width: 100%; max-width: 520px; height: 96vh; display: flex; flex-direction: column; align-items: center; position: relative; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 25px; padding: 15px; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; margin-bottom: 10px; }
        .logo-top { width: 65px; height: 65px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; }
        .title { font-family: 'Bangers', cursive; font-size: 34px; letter-spacing: 2px; color: #ffcc00; }
        .score-box { background: #fff; padding: 5px 15px; border-radius: 20px; color: #000; font-weight: 900; font-size: 18px; }

        .image-area { position: relative; width: 100%; flex: 1; max-height: 460px; background: #ffffff; border: 5px solid #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .layer-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.25s ease-out; }
        .layer-canvas.visible { opacity: 1; }
        #sourceImage { display: none; }

        .phase-badge { position: absolute; top: 12px; right: 12px; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.2s; text-transform: uppercase; z-index: 30; }
        .timer-wrapper { width: 100%; margin-bottom: 15px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
        .timer-bar { height: 100%; width: 0%; background: #00e5ff; }

        .answer-zone { height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; }
        .char-name { font-family: 'Bangers', cursive; font-size: 40px; color: #ffcc00; margin-bottom: 5px; opacity: 0; transform: translateY(15px); transition: all 0.4s; }
        .char-name.visible { opacity: 1; transform: translateY(0); }
        .anime-title { font-size: 18px; color: #00e5ff; font-weight: bold; opacity: 0; transition: opacity 0.4s; }
        .anime-title.visible { opacity: 1; }

        /* INTRO 1s & FIN */
        .overlay { position: absolute; inset: 0; background: linear-gradient(135deg, #1a1a1a 0%, #2a5298 100%); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #flyingIconsContainer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .flying-particle { position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0; }
        @keyframes explodeOut { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.3); opacity: 0; } }
        .intro-logo-heartbeat { width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid #000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10; animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(0.85); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        .end-box { background: #ffcc00; color: #000; border: 5px solid #000; box-shadow: 8px 8px 0 #00e5ff; padding: 25px; border-radius: 15px; transform: rotate(-2deg); margin-top: 25px; width: 90%; font-family: 'Bangers', cursive; font-size: 34px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <div class="title">DEVINE PAR COULEUR</div>
            <div class="score-box" id="scoreValue">1/8</div>
        </div>

        <div class="image-area" id="canvasContainer">
            <img src="" id="sourceImage" crossOrigin="Anonymous">
            <div id="phaseBadge" class="phase-badge"></div>
        </div>

        <div class="timer-wrapper"><div class="timer-bar" id="timerBar"></div></div>

        <div class="answer-zone">
            <div class="char-name" id="charName"></div>
            <div class="anime-title" id="animeTitle"></div>
        </div>

        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <div class="overlay" id="endScreen" style="display:none; background: rgba(0,0,0,0.95);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:160px;height:160px;" alt="Logo">
            <div class="end-box">DONNE TON SCORE EN COMMENTAIRE ! 👇</div>
        </div>
    </div>

    <script>
        const database = __DONNEES_IA__;
        const PHASE_NAMES = ["Rouge", "Bleu", "Vert", "Jaune", "Orange", "Violet", "Marron", "Blanc", "Noir", "Détails"];
        const PHASE_COLORS = ["#ff0000", "#0088ff", "#00ff00", "#ffee00", "#ffaa00", "#aa00ff", "#8B4513", "#ffffff", "#000000", "#888888"];
        const TEXT_COLORS = ["#fff", "#fff", "#000", "#000", "#000", "#fff", "#fff", "#000", "#fff", "#fff"];
        const STEP_TIME = 420;
        const TOTAL_PHASES = 10;
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];

        let currentIndex = 0, gameInterval = null, layers = [];
        const ui = {
            container: document.getElementById('canvasContainer'),
            img: document.getElementById('sourceImage'),
            name: document.getElementById('charName'),
            anime: document.getElementById('animeTitle'),
            timer: document.getElementById('timerBar'),
            score: document.getElementById('scoreValue'),
            badge: document.getElementById('phaseBadge')
        };

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1000 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '50px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; playLevel(); }, 150);
            }, 850);
        };

        function playLevel() {
            if (currentIndex >= database.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            clearInterval(gameInterval);
            document.querySelectorAll('.layer-canvas').forEach(e => e.remove());
            ui.name.className = 'char-name'; ui.anime.className = 'anime-title';
            ui.score.innerText = `${currentIndex + 1}/${database.length}`;
            ui.badge.style.opacity = 0;
            ui.timer.style.transition = 'none'; ui.timer.style.width = '0%';

            ui.img.crossOrigin = "Anonymous";
            ui.img.src = "https://wsrv.nl/?url=" + encodeURIComponent(database[currentIndex].imgUrl) + "&output=png";
            ui.img.onload = () => { createLayers(); startSequence(); };
        }

        function createLayers() {
            const w = 500;
            const h = Math.round(w * (ui.img.naturalHeight / ui.img.naturalWidth));
            const temp = document.createElement('canvas'); temp.width = w; temp.height = h;
            const ctx = temp.getContext('2d'); ctx.drawImage(ui.img, 0, 0, w, h);
            const data = ctx.getImageData(0, 0, w, h).data;

            const layersData = [];
            for (let i = 0; i < TOTAL_PHASES; i++) layersData.push(ctx.createImageData(w, h));

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                if (a < 50) continue;
                const [hue, sat, lig] = rgbToHsl(r, g, b);
                let target = 9;
                if (sat < 15) {
                    if (lig > 80) target = 7; else if (lig < 25) target = 8; else target = 9;
                } else {
                    if ((hue < 40 || hue > 330) && lig < 45) target = 6;
                    else if (hue >= 330 || hue < 15) target = 0;
                    else if (hue >= 15 && hue < 45) target = 4;
                    else if (hue >= 45 && hue < 75) target = 3;
                    else if (hue >= 75 && hue < 165) target = 2;
                    else if (hue >= 165 && hue < 260) target = 1;
                    else if (hue >= 260 && hue < 330) target = 5;
                }
                layersData[target].data[i] = r; layersData[target].data[i + 1] = g; layersData[target].data[i + 2] = b; layersData[target].data[i + 3] = 255;
            }

            layers = [];
            for (let i = 0; i < TOTAL_PHASES; i++) {
                const c = document.createElement('canvas');
                c.className = 'layer-canvas'; c.style.zIndex = i + 1; c.width = w; c.height = h;
                c.getContext('2d').putImageData(layersData[i], 0, 0);
                ui.container.appendChild(c); layers.push(c);
            }
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h *= 60;
            }
            return [h, s * 100, l * 100];
        }

        function startSequence() {
            let step = 0;
            const maxSteps = database[currentIndex].isBait ? 6 : TOTAL_PHASES;
            void ui.timer.offsetWidth;
            ui.timer.style.transition = `width ${STEP_TIME * maxSteps}ms linear`;
            ui.timer.style.width = '100%';

            gameInterval = setInterval(() => {
                if (step < maxSteps) {
                    layers[step].classList.add('visible');
                    ui.badge.innerText = PHASE_NAMES[step];
                    ui.badge.style.backgroundColor = PHASE_COLORS[step];
                    ui.badge.style.color = TEXT_COLORS[step];
                    ui.badge.style.opacity = 1;
                    step++;
                } else { clearInterval(gameInterval); reveal(); }
            }, STEP_TIME);
        }

        function reveal() {
            ui.badge.style.opacity = 0;
            const q = database[currentIndex];
            if (q.isBait) {
                ui.name.innerText = "TU L'AS TROUVÉ ?";
                ui.anime.innerText = "👇 ÉCRIS EN COMMENTAIRE ! 👇";
            } else {
                layers.forEach(l => l.classList.add('visible'));
                ui.name.innerText = q.name;
                ui.anime.innerText = "📺 " + q.anime;
            }
            ui.name.classList.add('visible'); ui.anime.classList.add('visible');
            setTimeout(() => { currentIndex++; playLevel(); }, 1800);
        }
    </script>
</body>
</html>
