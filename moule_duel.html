<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kill Quiz Duel VS</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Komika+Axis&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #2a0000 0%, #000000 100%); height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; font-family: 'Komika Axis', sans-serif; overflow: hidden; color: #fff; position: relative; }
        body::before { content: ""; position: absolute; top: 50%; left: 50%; width: 200vmax; height: 200vmax; background: repeating-conic-gradient(from 0deg, rgba(255,0,0,0.12) 0deg 5deg, transparent 5deg 10deg); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; animation: spinAction 60s linear infinite; }
        @keyframes spinAction { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        #gameContainer { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px 10px; max-width: 540px; width: 100%; height: 100%; }
        .header-zone { text-align: center; width: 100%; }
        .logo-top { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #ff0000; object-fit: cover; margin-bottom: 5px; }
        .round-title { font-family: 'Bangers', cursive; font-size: 36px; color: #ff0000; -webkit-text-stroke: 1.2px #fff; margin-bottom: 4px; }
        .cta-box { background: #ffcc00; color: #000; padding: 6px 15px; display: inline-block; transform: skew(-10deg); border: 3px solid #000; margin-bottom: 10px; box-shadow: 4px 4px 0 #ff0000; }
        .cta-text { font-family: 'Bangers', cursive; font-size: 20px; margin: 0; transform: skew(10deg); }

        .timer-container { width: 95%; height: 26px; background: #222; border: 3px solid #ff0000; transform: skew(-10deg); overflow: hidden; margin: 0 auto; }
        .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff0000, #ffcc00, #ff0000); transform-origin: left; }
        .animate-timer { animation: shrink linear forwards; }
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }

        .duel-container { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; position: relative; flex: 1; margin: 15px 0; }
        .card-wrapper { width: 49%; height: 85%; max-height: 380px; position: relative; display: flex; flex-direction: column; }
        .card-box { width: 100%; height: 100%; position: relative; border: 4px solid #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.6); background: #111; overflow: hidden; border-radius: 12px; transition: all 0.2s; }
        .img-bg-blur { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(14px) brightness(0.45); z-index: 1; }
        .card-img { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; }
        .char-name { font-family: 'Bangers', cursive; font-size: 28px; color: #ffee00; text-align: center; text-shadow: 3px 3px 0 #000; -webkit-text-stroke: 1.5px #000; position: absolute; bottom: 8px; width: 100%; z-index: 15; padding: 0 5px; }
        .vs-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Bangers', cursive; font-size: 58px; color: #ff0000; -webkit-text-stroke: 2px #fff; z-index: 20; text-shadow: 0 0 15px #000; }

        .shot-overlay { position: absolute; inset: 0; background: rgba(255, 0, 0, 0.55); opacity: 0; pointer-events: none; z-index: 10; transition: opacity 0.15s; }
        .card-wrapper.eliminated .shot-overlay { opacity: 1; }
        .card-wrapper.eliminated .card-box { transform: scale(0.94); border-color: #555; filter: grayscale(90%); }
        .card-wrapper.eliminated .char-name { text-decoration: line-through; color: #ff0000; }

        .feedback-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-family: 'Bangers', cursive; font-size: 52px; color: #ffcc00; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #ff0000; z-index: 50; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); white-space: nowrap; }
        .feedback-text.show { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }

        /* INTRO 1s & FIN */
        .overlay { position: absolute; inset: 0; background: linear-gradient(135deg, #2a0000 0%, #000000 100%); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #flyingIconsContainer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .flying-particle { position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0; }
        @keyframes explodeOut { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.3); opacity: 0; } }
        .intro-logo-heartbeat { width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid #ff0000; box-shadow: 0 15px 35px rgba(255,0,0,0.4); z-index: 10; animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(0.85); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        .end-box { background: #ffcc00; color: #000; border: 5px solid #ff0000; box-shadow: 8px 8px 0 #ff0000; padding: 25px; border-radius: 15px; transform: rotate(-2deg); margin-top: 25px; width: 90%; font-family: 'Bangers', cursive; font-size: 34px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="header-zone">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <div class="round-title" id="roundText">DUEL 1/4</div>
            <div class="cta-box"><p class="cta-text">QUI TU ÉLIMINES ? DIS-LE EN COMMENTAIRE ! 👇</p></div>
            <div class="timer-container"><div class="timer-bar" id="timerBar"></div></div>
        </div>

        <div class="duel-container">
            <div class="card-wrapper" id="charLeftWrapper">
                <div class="card-box">
                    <div class="img-bg-blur" id="bgLeft"></div>
                    <img id="imgLeft" src="" class="card-img">
                    <div class="shot-overlay"></div>
                    <div class="char-name" id="nameLeft"></div>
                </div>
            </div>
            <div class="vs-text">VS</div>
            <div class="card-wrapper" id="charRightWrapper">
                <div class="card-box">
                    <div class="img-bg-blur" id="bgRight"></div>
                    <img id="imgRight" src="" class="card-img">
                    <div class="shot-overlay"></div>
                    <div class="char-name" id="nameRight"></div>
                </div>
            </div>
            <div class="feedback-text" id="feedbackText">PAS DE JALOUX !</div>
        </div>
    </div>

    <div class="overlay" id="introOverlay">
        <div id="flyingIconsContainer"></div>
        <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
    </div>

    <div class="overlay" id="endScreen" style="display:none; background: rgba(0,0,0,0.95);">
        <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:160px;height:160px;" alt="Logo">
        <div class="end-box">
            DONNE TON SCORE ET TES CHOIX EN COMMENTAIRE ! 👇
        </div>
    </div>

    <script>
        const rawData = __DONNEES_IA__;
        // Regroupe automatiquement les 8 personnages en 4 duels VS
        const duels = [];
        for (let i = 0; i < rawData.length; i += 2) {
            if (rawData[i + 1]) {
                duels.push({ left: rawData[i], right: rawData[i + 1] });
            }
        }

        const ROUND_TIME = 3800;
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];
        let currentRound = 0;

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1000 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '50px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; setupRound(); }, 150);
            }, 850);
        };

        function setupRound() {
            if (currentRound >= duels.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            const data = duels[currentRound];
            document.getElementById('charLeftWrapper').classList.remove('eliminated');
            document.getElementById('charRightWrapper').classList.remove('eliminated');
            document.getElementById('feedbackText').classList.remove('show');

            document.getElementById('roundText').innerText = `DUEL ${currentRound + 1}/${duels.length}`;
            document.getElementById('imgLeft').src = data.left.imgUrl;
            document.getElementById('bgLeft').style.backgroundImage = `url('${data.left.imgUrl}')`;
            document.getElementById('nameLeft').innerText = data.left.name;

            document.getElementById('imgRight').src = data.right.imgUrl;
            document.getElementById('bgRight').style.backgroundImage = `url('${data.right.imgUrl}')`;
            document.getElementById('nameRight').innerText = data.right.name;

            const timerBar = document.getElementById('timerBar');
            timerBar.classList.remove('animate-timer');
            void timerBar.offsetWidth;
            timerBar.style.animationDuration = (ROUND_TIME / 1000) + "s";
            timerBar.classList.add('animate-timer');

            setTimeout(triggerElimination, ROUND_TIME);
        }

        function triggerElimination() {
            const texts = ["PAS DE JALOUX !", "DOUBLE ÉLIMINATION !", "TROP LENT !", "TU ÉLIMINES QUI ?"];
            document.getElementById('charLeftWrapper').classList.add('eliminated');
            document.getElementById('charRightWrapper').classList.add('eliminated');
            const fb = document.getElementById('feedbackText');
            fb.innerText = texts[currentRound % texts.length];
            fb.classList.add('show');

            setTimeout(() => { currentRound++; setupRound(); }, 1800);
        }
    </script>
</body>
</html>
