<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Rebus Emoji Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Komika+Axis&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; font-family: 'Komika Axis', sans-serif; overflow: hidden; color: #000; position: relative; }
        body::before { content: ""; position: absolute; top: 50%; left: 50%; width: 200vmax; height: 200vmax; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.05) 0deg 5deg, transparent 5deg 10deg); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; animation: spinAction 40s linear infinite; }
        @keyframes spinAction { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .app-container { width: 100%; max-width: 500px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; z-index: 1; padding: 15px; }
        .header { width: 100%; text-align: center; margin-top: 5px; flex-shrink: 0; }
        .logo-top { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #000; object-fit: cover; margin-bottom: 5px; }
        .title { font-family: 'Bangers', cursive; font-size: 36px; text-transform: uppercase; color: #fff; -webkit-text-stroke: 1.5px #000; text-shadow: 3px 3px 0 #ff0055; letter-spacing: 1px; transform: rotate(-2deg); line-height: 1; margin-bottom: 6px; }
        .subtitle-top { color: #ffcc00; font-size: 15px; text-shadow: 2px 2px 0 #000; font-weight: 700; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 8px; display: inline-block; border: 2px solid #000; }
        .level-box { display: inline-block; background: #fff; color: #000; text-transform: uppercase; font-weight: 700; font-size: 14px; padding: 5px 15px; border: 3px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,0.8); margin-top: 8px; transform: skew(-10deg); }

        .image-area-wrapper { width: 100%; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; margin: 10px 0; perspective: 1000px; }
        .image-area { position: relative; width: 100%; height: 100%; max-height: 380px; max-width: 380px; transform-style: preserve-3d; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3), 6px 6px 0 #000; }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; border-radius: 15px; overflow: hidden; border: 5px solid #fff; }
        .card-front { background-color: #f4f4f4; z-index: 2; padding: 15px; }
        .card-back { background-color: #111; transform: rotateY(180deg); z-index: 1; }
        .flipped .flip-card-inner { transform: rotateY(180deg); }

        .emoji-display { font-size: 72px; text-align: center; line-height: 1.3; }
        .img-bg-blur { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(16px) brightness(0.5); z-index: 1; }
        .img-perso { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; }

        .timer-wrapper { width: 95%; margin-bottom: 10px; flex-shrink: 0; }
        .timer-container { width: 100%; height: 25px; background: #333; border: 3px solid #fff; box-shadow: 4px 4px 0 #000; transform: skew(-10deg); }
        .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #4eff3b, #ffee00, #ff0055); transform-origin: left; }
        .animate-timer { animation: shrink linear forwards; }
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }

        .answer-zone { height: 130px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; text-align: center; position: relative; z-index: 10; flex-shrink: 0; }
        .main-answer-big { font-family: 'Bangers', cursive; font-size: 38px; line-height: 1.1; color: #ffcc00; text-transform: uppercase; margin-bottom: 8px; -webkit-text-stroke: 2px #000; text-shadow: 3px 3px 0 #d60000; opacity: 0; transform: scale(0.5); transition: all 0.4s; }
        .sub-info-small { font-size: 15px; font-weight: 700; color: #000; text-transform: uppercase; background: #fff; padding: 6px 15px; border: 3px solid #000; box-shadow: 4px 4px 0 rgba(0,0,0,0.8); opacity: 0; transform: translateY(20px); transition: all 0.4s ease 0.15s; }
        .visible { opacity: 1 !important; transform: scale(1) translateY(0) !important; }
        .counter { position: absolute; bottom: 10px; right: 12px; font-size: 22px; font-weight: 700; color: #fff; -webkit-text-stroke: 1.5px #000; font-family: 'Bangers', cursive; z-index: 20; }

        /* INTRO 1s & FIN */
        .overlay { position: absolute; inset: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #flyingIconsContainer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .flying-particle { position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0; }
        @keyframes explodeOut { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.3); opacity: 0; } }
        .intro-logo-heartbeat { width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid #000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10; animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(0.85); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        .end-box { background: #ffcc00; color: #000; border: 5px solid #000; box-shadow: 8px 8px 0 #ff0055; padding: 25px; border-radius: 15px; transform: rotate(-2deg); margin-top: 25px; width: 90%; font-family: 'Bangers', cursive; font-size: 34px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <div class="title">QUIZ EMOJI & RÉBUS</div>
            <div class="subtitle-top" id="promptDisplay">DEVINE LE PERSONNAGE OU L'ANIME</div><br>
            <div class="level-box" id="levelDisplay">FACILE</div>
        </div>

        <div class="image-area-wrapper">
            <div class="image-area" id="dynamicFrame">
                <div class="flip-card-inner" id="flipCardInner">
                    <div class="card-front"><div class="emoji-display" id="emojiZone"></div></div>
                    <div class="card-back" id="cardBack">
                        <div class="img-bg-blur" id="bgBlur"></div>
                        <img id="char-image" class="img-perso" src="" alt="Personnage">
                    </div>
                </div>
            </div>
        </div>

        <div class="timer-wrapper"><div class="timer-container"><div class="timer-bar" id="timerBar"></div></div></div>

        <div class="answer-zone">
            <div class="main-answer-big" id="mainAnswerDisplay"></div>
            <div class="sub-info-small" id="subInfoDisplay"></div>
        </div>
        <div class="counter" id="counter"></div>

        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <div class="overlay" id="endScreen" style="display:none; background: rgba(21,21,32,0.96);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:160px;height:160px;" alt="Logo">
            <div class="end-box">
                DONNE TON SCORE EN COMMENTAIRE ! 👇<br>
                <span style="font-size:24px;color:#d60000;">AS-TU TROUVÉ LE N°3 ?</span>
            </div>
        </div>
    </div>

    <script>
        const database = __DONNEES_IA__;
        const TIME_GUESS = 3600;
        const TIME_SHOW = 1900;
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];
        let index = 0;

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1000 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '50px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; startQuizRound(); }, 150);
            }, 850);
        };

        function startQuizRound() {
            if (index >= database.length) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }
            const data = database[index];
            const dynamicFrame = document.getElementById('dynamicFrame');
            dynamicFrame.classList.remove('flipped');

            document.getElementById('cardBack').style.borderColor = data.color || '#ffcc00';
            document.getElementById('levelDisplay').innerText = data.level || 'NORMAL';
            document.getElementById('mainAnswerDisplay').classList.remove('visible');
            document.getElementById('subInfoDisplay').classList.remove('visible');

            document.getElementById('emojiZone').innerText = data.emojis || '❓';
            document.getElementById('bgBlur').style.backgroundImage = `url('${data.imgUrl}')`;
            document.getElementById('char-image').src = data.imgUrl;
            document.getElementById('counter').innerText = `${index + 1} / ${database.length}`;

            const timerBar = document.getElementById('timerBar');
            timerBar.classList.remove('animate-timer');
            void timerBar.offsetWidth;
            timerBar.style.animationDuration = (TIME_GUESS / 1000) + "s";
            timerBar.classList.add('animate-timer');

            setTimeout(() => revealAnswer(data), TIME_GUESS);
        }

        function revealAnswer(data) {
            const mainAnswer = document.getElementById('mainAnswerDisplay');
            const subInfo = document.getElementById('subInfoDisplay');

            if (data.isBait || index === 2) {
                mainAnswer.innerText = "ALORS ? TU AS DEVINÉ ?";
                mainAnswer.style.color = "#fff";
                subInfo.innerText = "👇 RÉPONSE EN COMMENTAIRE ! 👇";
            } else {
                document.getElementById('dynamicFrame').classList.add('flipped');
                mainAnswer.innerText = data.name;
                mainAnswer.style.color = "#ffcc00";
                subInfo.innerText = "💡 " + (data.anime || "Anime");
            }

            mainAnswer.classList.add('visible');
            subInfo.classList.add('visible');
            setTimeout(() => { index++; startQuizRound(); }, TIME_SHOW);
        }
    </script>
</body>
</html>
