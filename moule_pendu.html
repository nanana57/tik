<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeu du Pendu Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Komika+Axis&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; font-family: 'Komika Axis', sans-serif; overflow: hidden; color: #000; position: relative; }
        body::before { content: ""; position: absolute; top: 50%; left: 50%; width: 200vmax; height: 200vmax; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.1) 0deg 5deg, transparent 5deg 10deg); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; animation: spinAction 40s linear infinite; }
        @keyframes spinAction { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .app-container { width: 100%; max-width: 520px; height: 100vh; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; padding: 15px; }
        .header { width: 100%; text-align: center; margin-top: 10px; margin-bottom: 10px; }
        .logo-top { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #000; box-shadow: 3px 3px 0 #000; object-fit: cover; margin-bottom: 5px; }
        .title-main { font-family: 'Bangers', cursive; font-size: 42px; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #000; margin: 0; letter-spacing: 1px; transform: rotate(-2deg); line-height: 0.9; }
        .counter-badge { background: #000; color: #ffeb3b; padding: 5px 15px; border-radius: 20px; border: 2px solid #fff; font-size: 13px; font-weight: bold; display: inline-block; margin-top: 8px; box-shadow: 3px 3px 0 rgba(0,0,0,0.5); }

        .game-zone { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: relative; }
        .rank-box { background: #fff; color: #000; border: 4px solid #000; box-shadow: 6px 6px 0 rgba(0,0,0,1); padding: 6px 20px; transform: skew(-5deg); margin-bottom: 18px; text-align: center; transition: all 0.3s ease; min-width: 260px; }
        .rank-text { font-family: 'Bangers', cursive; font-size: 32px; line-height: 1; text-transform: uppercase; }
        .rank-points { font-size: 14px; font-weight: bold; margin-top: 2px; }

        .rank-roi { color: #ffdb00; text-shadow: 2px 2px 0 #000; }
        .rank-empereur { color: #ff0055; text-shadow: 2px 2px 0 #000; }
        .rank-shichibukai { color: #a020f0; text-shadow: 2px 2px 0 #000; }
        .rank-supernova { color: #00c6ff; text-shadow: 2px 2px 0 #000; }
        .rank-pirate { color: #00e676; text-shadow: 2px 2px 0 #000; }
        .rank-mousse { color: #999; text-shadow: 2px 2px 0 #000; }

        .word-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-bottom: 15px; width: 100%; perspective: 1000px; }
        .word-row { display: flex; flex-wrap: nowrap; justify-content: center; gap: 4px; width: 100%; }
        .char-card { width: 34px; height: 48px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex-shrink: 0; }
        .char-card.flipped { transform: rotateY(180deg); }
        .char-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border: 2px solid #000; border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        .char-front { background: #fff; }
        .char-back { background: #ff0055; color: #fff; transform: rotateY(180deg); font-family: 'Bangers', cursive; font-size: 24px; -webkit-text-stroke: 1px #000; }

        .image-reveal-container { position: relative; width: 250px; height: 250px; border: 5px solid #fff; background: #111; box-shadow: 0 0 0 4px #000, 10px 10px 0 rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; overflow: hidden; transform: scale(0) rotate(-10deg); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; margin-top: 5px; border-radius: 12px; }
        .image-reveal-container.visible { transform: scale(1) rotate(-2deg); opacity: 1; }
        .img-bg-blur { position: absolute; inset: -10%; background-size: cover; background-position: center; filter: blur(15px) brightness(0.5); z-index: 1; }
        .char-img { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; }
        .bait-msg { position: relative; z-index: 3; color: #ffee00; font-family: 'Bangers', cursive; font-size: 32px; text-align: center; padding: 15px; -webkit-text-stroke: 1.5px #000; }

        /* INTRO 1 SECONDE & OUTRO */
        .overlay { position: absolute; inset: 0; background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #flyingIconsContainer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .flying-particle { position: absolute; top: 50%; left: 50%; object-fit: contain; opacity: 0; }
        @keyframes explodeOut { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.3); opacity: 0; } }
        .intro-logo-heartbeat { width: 210px; height: 210px; border-radius: 50%; object-fit: cover; border: 6px solid #000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 10; animation: heartbeat 0.85s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(0.85); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
        .intro-fade-out { opacity: 0; transition: opacity 0.15s ease-out; pointer-events: none; }
        .end-box { background: #ffea00; color: #000; border: 5px solid #000; box-shadow: 8px 8px 0 #000; padding: 25px; border-radius: 15px; transform: rotate(-2deg); margin-top: 25px; width: 90%; font-family: 'Bangers', cursive; font-size: 34px; line-height: 1.2; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="logo-top" alt="Logo">
            <h1 class="title-main">JEU DU PENDU</h1>
            <div class="counter-badge" id="qCounter">QUESTION 1 / 8</div>
        </div>

        <div class="game-zone" id="gameZone">
            <div class="rank-box" id="rankBox">
                <div class="rank-text rank-roi" id="rankText">ROI DES PIRATES</div>
                <div class="rank-points" id="rankPoints">6 PTS</div>
            </div>
            <div class="word-container" id="wordContainer"></div>
            <div class="image-reveal-container" id="imageReveal"></div>
        </div>

        <!-- INTRO 1s -->
        <div class="overlay" id="introOverlay">
            <div id="flyingIconsContainer"></div>
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" alt="Logo">
        </div>

        <!-- FIN -->
        <div class="overlay" id="resultScreen" style="display:none; background: rgba(0,0,0,0.94);">
            <img src="https://raw.githubusercontent.com/nanana57/tik/main/logo.png" class="intro-logo-heartbeat" style="width:160px;height:160px;" alt="Logo">
            <div class="end-box">
                DONNE TON SCORE EN COMMENTAIRE ! 👇<br>
                <span style="font-size:24px; color:#d60000;">ET ABONNE-TOI POUR LA PARTIE 2 !</span>
            </div>
        </div>
    </div>

    <script>
        const database = __DONNEES_IA__;
        const TICK_RATE = 750;
        const ranks = [
            { title: "LÉGENDE", css: "rank-roi", points: 6 },
            { title: "EMPEREUR", css: "rank-empereur", points: 5 },
            { title: "PRO", css: "rank-shichibukai", points: 4 },
            { title: "SOLIDE", css: "rank-supernova", points: 3 },
            { title: "NOVICE", css: "rank-pirate", points: 2 },
            { title: "MOUSSE", css: "rank-mousse", points: 1 }
        ];
        const daIcons = [
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-2.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-3.png",
            "https://raw.githubusercontent.com/nanana57/tik/main/icon-4.png"
        ];

        let currentQ = 0, currentRankIdx = 0, gameTimer = null;

        window.onload = () => {
            const container = document.getElementById('flyingIconsContainer');
            for (let i = 0; i < 16; i++) {
                const img = document.createElement('img');
                img.src = daIcons[i % daIcons.length];
                img.className = 'flying-particle';
                img.style.setProperty('--tx', (Math.random() - 0.5) * 800 + 'px');
                img.style.setProperty('--ty', (Math.random() - 0.5) * 1000 + 'px');
                img.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                img.style.width = '50px';
                img.style.animation = 'explodeOut 0.95s ease-out forwards';
                container.appendChild(img);
            }
            setTimeout(() => {
                const intro = document.getElementById('introOverlay');
                intro.classList.add('intro-fade-out');
                setTimeout(() => { intro.style.display = 'none'; loadLevel(); }, 150);
            }, 850);
        };

        function loadLevel() {
            if (currentQ >= database.length) {
                document.getElementById('resultScreen').style.display = 'flex';
                return;
            }
            document.getElementById('qCounter').innerText = `QUESTION ${currentQ + 1} / ${database.length}`;
            const revealBox = document.getElementById('imageReveal');
            revealBox.classList.remove('visible');
            revealBox.innerHTML = '';

            const qData = database[currentQ];
            const cleanName = (qData.name || "MYSTERE").toUpperCase();
            const parts = cleanName.split(" ");
            let line1 = parts.length > 1 ? parts.slice(0, -1).join(" ") : parts[0];
            let line2 = parts.length > 1 ? parts[parts.length - 1] : "";

            const container = document.getElementById('wordContainer');
            container.innerHTML = '';

            const createRow = (text) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'word-row';
                for (let i = 0; i < text.length; i++) {
                    if (text[i] === " ") {
                        const sp = document.createElement('div'); sp.style.width = "12px"; rowDiv.appendChild(sp);
                    } else {
                        const card = document.createElement('div'); card.className = 'char-card';
                        card.innerHTML = `<div class="char-face char-front"></div><div class="char-face char-back">${text[i]}</div>`;
                        rowDiv.appendChild(card);
                    }
                }
                return rowDiv;
            };

            const r1 = createRow(line1); container.appendChild(r1);
            const r2 = line2 ? createRow(line2) : null; if (r2) container.appendChild(r2);

            const revealHints = (rowEl) => {
                if (!rowEl) return;
                const cards = Array.from(rowEl.querySelectorAll('.char-card'));
                if (cards.length > 0) cards[0].classList.add('flipped');
                if (cards.length > 5) cards[cards.length - 1].classList.add('flipped');
            };
            revealHints(r1); revealHints(r2);

            currentRankIdx = 0; updateRankUI();
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(gameLoop, TICK_RATE);
        }

        function gameLoop() {
            const hiddenCards = Array.from(document.querySelectorAll('#wordContainer .char-card:not(.flipped)'));
            if (hiddenCards.length <= 1 || currentRankIdx >= ranks.length - 1) { finishLevel(); return; }
            hiddenCards[Math.floor(Math.random() * hiddenCards.length)].classList.add('flipped');
            currentRankIdx++; updateRankUI();
        }

        function updateRankUI() {
            const data = ranks[currentRankIdx];
            const rText = document.getElementById('rankText');
            rText.innerText = data.title; rText.className = `rank-text ${data.css}`;
            document.getElementById('rankPoints').innerText = data.points + " PTS";
        }

        function finishLevel() {
            clearInterval(gameTimer);
            const qData = database[currentQ];
            const revealBox = document.getElementById('imageReveal');

            if (qData.isBait) {
                revealBox.innerHTML = `<div class="bait-msg">TU L'AS TROUVÉ ?<br>ÉCRIS-LE EN COMMENTAIRE ! 👇</div>`;
            } else {
                document.querySelectorAll('.char-card').forEach(c => c.classList.add('flipped'));
                revealBox.innerHTML = `<div class="img-bg-blur" style="background-image:url('${qData.imgUrl}')"></div><img src="${qData.imgUrl}" class="char-img">`;
            }
            revealBox.classList.add('visible');
            setTimeout(() => { currentQ++; loadLevel(); }, 2000);
        }
    </script>
</body>
</html>
